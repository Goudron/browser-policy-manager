name: Firefox Live Policy Tests

on:
  schedule:
    # Tuesday 03:17 UTC: a reviewed, off-peak deterministic local-runtime signal.
    - cron: "17 3 * * 2"
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: "Type RUN to execute the live Firefox policy suite."
        required: true
        default: "skip"

permissions:
  contents: read

jobs:
  firefox-live:
    if: ${{ github.event_name == 'schedule' || inputs.run_live_tests == 'RUN' }}
    name: Firefox local policy (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel:
          - release
          - esr153
          - esr140
          - esr115

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore verified browser archives
        uses: actions/cache@v5
        with:
          path: .bpm-test-browsers/cache
          key: firefox-live-${{ runner.os }}-${{ matrix.channel }}-${{ hashFiles('tools/firefox_live_browsers_manifest_0_9_4.json') }}

      - name: Setup isolated Firefox sandbox
        run: |
          make setup-firefox-live-browsers FIREFOX_CHANNEL="${{ matrix.channel }}"

      - name: Verify isolated Firefox sandbox
        run: |
          make verify-firefox-live-browsers FIREFOX_CHANNEL="${{ matrix.channel }}"

      - name: Run deterministic local Firefox policy workflow
        run: |
          make firefox-live-workflow FIREFOX_CHANNEL="${{ matrix.channel }}" FIREFOX_LIVE_ARTIFACT_DIR="artifacts/firefox-live/${{ matrix.channel }}"

      - name: Upload Firefox live evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: firefox-live-${{ matrix.channel }}
          path: artifacts/firefox-live/${{ matrix.channel }}
          if-no-files-found: warn
          retention-days: 14
