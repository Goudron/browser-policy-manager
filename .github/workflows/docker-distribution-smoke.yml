name: Docker distribution smoke

on:
  workflow_dispatch:
    inputs:
      run_docker_smoke:
        description: Type RUN to build and smoke-test the BPM Docker distribution.
        required: true
        default: ""

permissions:
  contents: read

jobs:
  docker-distribution-smoke:
    if: ${{ inputs.run_docker_smoke == 'RUN' }}
    name: Build and verify BPM 0.9.5 Docker distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install distribution and documentation tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pinned documentation toolchain
        run: make setup-docs-toolchain

      - name: Build verified documentation package
        run: |
          make docs-package
          make docs-package-verify

      - name: Build and smoke-test Docker image
        run: |
          make docker-build
          python tools/docker_distribution_smoke.py --image browser-policy-manager:0.9.5

      - name: Publish non-secret release evidence summary
        run: |
          {
            echo "## BPM 0.9.5 Docker distribution smoke"
            echo
            echo "- Source revision: \`$(git rev-parse --verify HEAD)\`"
            echo "- Documentation archive: \`$(sha256sum documentation/dist/bpm-documentation-0.9.5.tar.gz)\`"
            echo "- Local image digest: \`$(docker image inspect browser-policy-manager:0.9.5 --format '{{index .RepoDigests 0}}')\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Result: explicit migration, health/readiness, documentation and restart smoke passed."
          } >> "$GITHUB_STEP_SUMMARY"
