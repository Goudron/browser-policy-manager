name: Firefox Live AMO Canary

on:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: "Type RUN to execute the live Firefox AMO canary suite."
        required: true
        default: "skip"

permissions:
  contents: read

jobs:
  firefox-live-amo:
    if: ${{ inputs.run_live_tests == 'RUN' }}
    name: Firefox Live AMO (${{ matrix.channel }})
    runs-on: ubuntu-latest
    # AMO is an external canary, never the deterministic live-policy gate.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel:
          - release
          - esr153
          - esr140

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore verified browser archives
        uses: actions/cache@v5
        with:
          path: .bpm-test-browsers/cache
          key: firefox-live-${{ runner.os }}-${{ matrix.channel }}-${{ hashFiles('tools/firefox_live_browsers_manifest_0_9_4.json') }}

      - name: Setup isolated Firefox sandbox
        run: |
          make setup-firefox-live-browsers FIREFOX_CHANNEL="${{ matrix.channel }}"

      - name: Verify isolated Firefox sandbox
        run: |
          make verify-firefox-live-browsers FIREFOX_CHANNEL="${{ matrix.channel }}"

      - name: Run Firefox AMO canary tests
        run: |
          make test-firefox-live-amo FIREFOX_CHANNEL="${{ matrix.channel }}" FIREFOX_LIVE_AMO_ARTIFACT_DIR="artifacts/firefox-live-amo/${{ matrix.channel }}"

      - name: Upload AMO canary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: firefox-live-amo-${{ matrix.channel }}
          path: artifacts/firefox-live-amo/${{ matrix.channel }}
          if-no-files-found: warn
          retention-days: 14
