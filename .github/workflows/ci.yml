name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Test work is partitioned by the primary layer in tests/test-layer-ownership-0.9.4.json.
# Coverage consumes data produced by those owners; it never reruns their tests.  Firefox live
# and the external AMO canary remain in their dedicated scheduled/manual workflows.
jobs:
  lint:
    name: Static analysis — lint, type, architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install static-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: make lint

      - name: Mypy
        run: make typecheck

      - name: Python architecture contracts
        run: make architecture

  base-runtime:
    name: Package distribution and extras smoke
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install packaging gate tooling without AI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Verify release boundary and clean package artifacts
        run: |
          make release-boundary
          make package-smoke

  unit-tests:
    name: Product unit layer
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Provision checksum-pinned offline Firefox schema inputs
        run: make provision-firefox-schema-inputs

      - name: Setup Node.js for generated profile assets
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Build deterministic profile frontend assets
        run: |
          npm ci
          make verify-frontend-vendor
          make check-profiles-css
          make build-profile-frontend-bundles

      - name: Run the owned unit layer
        run: make test-unit

  integration-tests:
    name: Product integration layer (non-database)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai]"

      - name: Provision checksum-pinned offline Firefox schema inputs
        run: make provision-firefox-schema-inputs

      - name: Setup Node.js for generated profile assets
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Build deterministic profile frontend assets
        run: |
          npm ci
          make verify-frontend-vendor
          make check-profiles-css
          make build-profile-frontend-bundles

      - name: Run the owned non-database integration layer
        run: make test-integration

  postgres-integration:
    name: PostgreSQL migration and integration layer
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bpm_m4_05
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bpm_m4_05"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install PostgreSQL integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
          pip check

      - name: Run the owned database integration layer
        env:
          BPM_POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bpm_m4_05
          BPM_POSTGRES_CLIENT_DOCKER_IMAGE: postgres:17-alpine
        run: make test-postgres-integration

      - name: Report PostgreSQL service and migration evidence
        env:
          BPM_POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bpm_m4_05
        run: make postgres-ci-evidence

  ai-incubation-tests:
    name: Opt-in AI implementation layer
    runs-on: ubuntu-latest
    needs: lint
    env:
      COVERAGE_FILE: .coverage.ai-incubation

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install opt-in AI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai]"

      - name: Setup Node.js for generated profile assets
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Build deterministic profile frontend assets
        run: |
          npm ci
          make verify-frontend-vendor
          make check-profiles-css
          make build-profile-frontend-bundles

      - name: Run the owned opt-in AI implementation layer
        run: make test-ai-incubation-coverage

      - name: Upload opt-in AI coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage-ai-incubation
          path: .coverage.ai-incubation
          # Coverage.py writes a hidden data file.  v6 excludes hidden files
          # unless this is explicit, which would leave the aggregate gate with
          # no input despite a successful owner test.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release-implementation-coverage:
    name: Release implementation coverage boundary
    runs-on: ubuntu-latest
    needs: lint
    env:
      COVERAGE_FILE: .coverage.release-implementation

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install release implementation test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the owned release implementation boundary
        run: make coverage-release-implementation

      - name: Upload release implementation coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage-release-implementation
          path: .coverage.release-implementation
          # See the opt-in owner above: this hidden Coverage.py data file is a
          # required input to the aggregate coverage gate.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency audit and CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Install resolved Python audit contour
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,ai]"

      - name: Install locked npm audit contour
        run: npm ci

      - name: Audit dependencies and generate CycloneDX evidence
        run: make dependency-audit

      - name: Upload transient audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audit-evidence
          path: artifacts/dependency-audit/
          if-no-files-found: warn
          retention-days: 14

  contract-tests:
    name: Product contract layer
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai]"

      - name: Provision checksum-pinned offline Firefox schema inputs
        run: make provision-firefox-schema-inputs

      - name: Setup Node.js for generated profile assets
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Build deterministic profile frontend assets
        run: |
          npm ci
          make verify-frontend-vendor
          make check-profiles-css
          make build-profile-frontend-bundles

      - name: Run the owned product contract layer
        run: make test-contract

  documentation-coverage:
    name: Documentation tooling coverage and contract layer
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install documentation and local-RAG contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai]"

      - name: Install documentation PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf poppler-utils

      - name: Run the owned non-browser documentation partition
        run: |
          make docs-coverage
          make test-docs

      - name: Upload documentation coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: documentation-coverage-artifacts
          path: documentation/reports/coverage/
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: Native JavaScript layer and coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Install pinned frontend tooling
        run: npm ci

      - name: Run the owned native JavaScript partition with coverage
        run: make test-frontend-coverage

      - name: Upload native JavaScript coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-artifacts
          path: artifacts/coverage/frontend/
          if-no-files-found: warn
          retention-days: 14

  chromium-tests:
    name: Chromium product and documentation browser layer
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai,postgres]"

      - name: Setup Node.js for generated profile assets
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Build deterministic profile frontend assets
        run: |
          npm ci
          make verify-frontend-vendor
          make check-profiles-css
          make build-profile-frontend-bundles

      - name: Install matching Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Run the owned Chromium browser partition
        env:
          BPM_CHROMIUM_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          BPM_CHROMEDRIVER_BINARY: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          make test-browser
          make test-docs-browser

      - name: Upload Chromium failure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: chromium-failure-artifacts
          path: artifacts/browser-failures/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Python coverage aggregation
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - postgres-integration
      - ai-incubation-tests
      - release-implementation-coverage
      - contract-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install coverage reporter
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download owned Python coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: python-coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Combine and enforce current Python coverage floor
        run: make coverage-report

      - name: Upload aggregated coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-artifacts
          path: |
            artifacts/coverage/python/coverage.xml
            artifacts/coverage/python/html/
          if-no-files-found: warn
          retention-days: 14

  required-gates:
    name: Required CI gate summary
    runs-on: ubuntu-latest
    needs:
      - base-runtime
      - dependency-audit
      - documentation-coverage
      - frontend-tests
      - chromium-tests
      - coverage

    steps:
      - name: Publish CI ownership summary
        run: |
          {
            echo "## BPM CI layer graph"
            echo
            echo "Static analysis → unit, non-database integration, PostgreSQL, product contracts, documentation, native JavaScript, Chromium."
            echo "Dependency audit resolves base and optional Python contours plus package-lock npm, then publishes transient CycloneDX evidence."
            echo "Their Python coverage data is combined only by the coverage job; no layer is rerun there."
            echo "Firefox local-policy and AMO canary workflows remain outside this required PR graph."
          } >> "$GITHUB_STEP_SUMMARY"
