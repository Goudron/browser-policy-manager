<header class="compact-toolbar surface-panel fade-up mb-4" data-bpm-header>
    <div class="compact-toolbar-main" data-bpm-header-brand>
        <h1 class="compact-toolbar-title text-slate-900">
            {{ app_name }}
            <span class="compact-toolbar-version">v{{ app_version }}</span>
        </h1>
        <p class="compact-toolbar-firefox-versions" data-supported-firefox-versions>
            <span class="compact-toolbar-firefox-versions-label" data-i18n="profiles.supported_firefox_versions">{{ tr("profiles.supported_firefox_versions") }}</span>
            {% for option in header_schema_options %}
            <span data-firefox-channel="{{ option.value }}">
                <span data-i18n="{{ option.i18n_key }}">{{ option.label }}</span>{% if not loop.last %}, {% endif %}
            </span>
            {% endfor %}
        </p>
        {% if documentation_home_href %}
        <a
            class="compact-toolbar-docs-link"
            href="{{ documentation_home_href }}"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="profiles.documentation_link"
            data-documentation-links='{{ documentation_home_links | tojson }}'
            data-documentation-link>
            {{ tr("profiles.documentation_link") }}
        </a>
        {% endif %}
    </div>

    <div class="compact-toolbar-side">
        <div class="compact-counter compact-counter--pending" data-bpm-header-workspace>
            <strong id="workspace-profile-count" aria-hidden="true"></strong>
            <span id="workspace-profile-label" aria-hidden="true"></span>
        </div>
        <div class="compact-toolbar-actions" data-bpm-header-preferences>
            <label class="compact-toolbar-control" data-bpm-header-control="locale">
                <span class="compact-toolbar-copy">
                    <strong data-i18n="profiles.locale_label">{{ tr("profiles.locale_label") }}</strong>
                </span>
                <select id="lang" class="soft-input rounded-xl px-3 py-2 text-sm">
                    <option value="system" selected data-i18n="profiles.locale_system">{{ tr("profiles.locale_system") }}</option>
                    {% for locale_option in locale_picker_options %}
                    <option
                        value="{{ locale_option.code }}"
                        lang="{{ locale_option.bcp47 }}"
                        data-locale-code="{{ locale_option.code }}"
                        data-locale-bcp47="{{ locale_option.bcp47 }}"
                        data-locale-native-name="{{ locale_option.native_name }}"
                        data-locale-has-catalog="{{ 'true' if locale_option.has_catalog else 'false' }}"
                        {% if not locale_option.has_catalog %}disabled{% endif %}>{{ locale_option.native_name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="compact-toolbar-control" data-bpm-header-control="theme">
                <span class="compact-toolbar-copy">
                    <strong data-i18n="profiles.theme_label">{{ tr("profiles.theme_label") }}</strong>
                </span>
                <select id="theme" class="soft-input rounded-xl px-3 py-2 text-sm">
                    <option value="system" selected data-i18n="profiles.theme_system">{{ tr("profiles.theme_system") }}</option>
                    <option value="light" data-i18n="profiles.theme_light">{{ tr("profiles.theme_light") }}</option>
                    <option value="dark" data-i18n="profiles.theme_dark">{{ tr("profiles.theme_dark") }}</option>
                </select>
            </label>
        </div>
    </div>
</header>
