minimum_pre_commit_version: 4.6.1
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep hook engines aligned with the reviewed dev-tool constraints.
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # Keep this aligned with `make typecheck`, independently of staged
        # filenames, so application modules cannot fall out of hook coverage.
        entry: mypy app
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - pydantic>=2
          - sqlalchemy>=2
          - types-PyYAML

  - repo: local
    hooks:
      - id: mypy-docs-extract-rag
        name: mypy documentation RAG extraction utility
        # Module mode is required for the utility's relative import.  Its
        # build-docs dependency tree has a separate owner, so do not follow it
        # into this focused script check.
        entry: mypy --follow-imports=skip -m documentation.tools.extract_rag_chunks_0_9_3
        language: python
        additional_dependencies: [mypy==2.3.0]
        pass_filenames: false
        always_run: true
      # This is deliberately not a product-suite claim.  The complete layer
      # owners remain explicit Make/CI release gates.
      - id: layered-fast-architecture
        name: layered fast architecture checks (not full suite)
        entry: make pre-commit-check
        language: system
        pass_filenames: false
        always_run: true
